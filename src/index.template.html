<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Budget Ledger</title>
<style>
:root{--bg:#0d0f12;--card:#1a1e24;--line:#3a414c;--text:#ffffff;--muted:#c9d1d9;--accent:#ffd34d;--good:#4ade80;--warn:#facc15;--bad:#f87171;--btn:#2b3340;--fs:20px}
body.light{--bg:#ffffff;--card:#f2f4f7;--line:#9aa3ad;--text:#000000;--muted:#2b2f36;--accent:#0040c0;--good:#0a7a2f;--warn:#8a5a00;--bad:#b00020;--btn:#e1e6ec}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.45}
main{max-width:640px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:1.5em;margin:.2em 0 .4em}
h2{font-size:1.2em;margin:1.2em 0 .5em}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.big{font-size:1.8em;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
button,.btn{font:inherit;color:var(--text);background:var(--btn);border:2px solid var(--line);border-radius:12px;padding:14px 16px;min-height:56px;cursor:pointer}
button.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:56px}
label{display:block;font-weight:700;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:22px;border-radius:11px;background:var(--btn);overflow:hidden;border:2px solid var(--line);margin:6px 0 2px}
.bar>span{display:block;height:100%}
.ok{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.fill-ok{background:var(--good)}.fill-warn{background:var(--warn)}.fill-bad{background:var(--bad)}
.alert{border-left:8px solid var(--bad);border-radius:0;background:var(--card);padding:12px 14px;margin:10px 0;font-weight:700}
.alert.w{border-left-color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav a{color:var(--text);text-decoration:none;text-align:center;padding:12px 2px;font-size:.8em;font-weight:700;min-height:64px;display:flex;flex-direction:column;justify-content:center}
nav a[aria-current="page"]{background:var(--accent);color:#000}
.tx{display:flex;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%}
.seg button[aria-pressed="true"]{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
.sr{position:absolute;left:-9999px}
#toast{position:fixed;left:12px;right:12px;bottom:90px;max-width:616px;margin:0 auto;background:var(--accent);color:#000;font-weight:700;padding:14px;border-radius:12px;display:none;z-index:9}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input[type=checkbox]{width:32px;height:32px;min-height:0;flex:none;margin-top:4px}
.chk select{margin-top:6px;min-height:48px;padding:8px}
.tag{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:8px;border:2px solid var(--line);margin-left:6px}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="big">Loading your ledger…</p></main>
<div id="toast" role="status"></div>
<script>window.addEventListener("error",function(e){var d=document.getElementById("app");if(d)d.insertAdjacentHTML("afterbegin","<p style=\"color:#f87171\">Error: "+String(e.message).replace(/</g,"&lt;")+" (line "+e.lineno+")</p>")});</script>
<nav aria-label="Main">
  <a href="#home" data-v="home">Home</a>
  <a href="#add" data-v="add">Add</a>
  <a href="#history" data-v="history">History</a>
  <a href="#import" data-v="import">Import</a>
  <a href="#settings" data-v="settings">Settings</a>
</nav>
<script>(0,eval)(decodeURIComponent(escape(atob("__B64__"))))</script>
</body>
</html>
